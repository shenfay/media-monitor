[project]
name = "media-monitor-crawl"
version = "0.1.0"
description = "MediaMonitor 抓取服务 — 从 Redis Stream 消费抓取任务，执行数据抓取并回写"
requires-python = ">=3.10"
dependencies = [
    "redis>=5.0.0",
    "typer>=0.12.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
fast-http = ["httpx>=0.27.0"]
browser  = ["crawlee>=0.5.0", "playwright>=1.40.0"]
db       = ["psycopg2-binary>=2.9.0"]
dev      = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]
all      = ["media-monitor-crawl[fast-http,browser,db,dev]"]

[project.scripts]
crawl = "crawl.app:cli"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
